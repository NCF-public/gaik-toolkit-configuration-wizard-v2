# Accepted findings for the Solution Wizard V2 security checks
# (.github/workflows/solution-wizard-v2.yml, jobs security and security-images).
#
# Only HIGH and CRITICAL findings with a fix available fail CI; everything
# else is reported without failing and needs no entry here. Add an entry only
# for a blocking finding that is understood and accepted for a while.
#
# Every entry needs:
#   id       advisory or check ID: GHSA-..., PYSEC-..., CVE-..., or a Trivy
#            check ID (DS-0002, KSV-0014, ...); an alias of the finding matches
#   reason   why it is accepted, and what would end the exception
#   expires  YYYY-MM-DD; after it the entry stops applying and CI fails again
# Optional narrowing:
#   source   pip-audit | npm-audit | trivy
#   package  package name
#   target   glob over the scanned file or image (Trivy's Target)
#
# Keep expiries short (a few months) so each exception is looked at again.
