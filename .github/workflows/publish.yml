name: Publish to Production PyPI

on:
  workflow_dispatch:  # Allow manual trigger
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v0.1.0

# Each job asks for the token permissions it needs; nothing is granted by default.
permissions: {}

jobs:
  # Run tests before publishing
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.ref }}  # Pass the tag ref to test workflow
      release_gate: true  # Offline checks AND authenticated component certification are mandatory
    # Only the provider credentials the release gate (and, on a manual run, the live
    # LLM tests) use, never the PyPI tokens.
    secrets:
      AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
      AZURE_DEPLOYMENT: ${{ secrets.AZURE_DEPLOYMENT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      AITTA_API_KEY: ${{ secrets.AITTA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}

  build-and-publish:
    needs: test  # The reusable workflow includes the mandatory live release gate
    runs-on: ubuntu-latest
    environment: release  # Use GitHub environment for protection
    permissions:
      contents: write      # Required for creating GitHub releases
      pull-requests: read  # Required for generating release notes

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.ref }}  # Checkout the exact tag commit
        persist-credentials: false
        fetch-depth: 0  # Required for setuptools-scm to read git tags

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      env:
        # Force setuptools-scm to use the tag version, ignoring git state
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.ref_name }}
      run: |
        # Remove 'v' prefix from tag (v0.2.26 -> 0.2.26)
        export SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION#v}
        echo "Building with version: $SETUPTOOLS_SCM_PRETEND_VERSION"
        python -m build

    - name: Validate version matches tag
      run: |
        # Extract version from tag (v0.2.24 -> 0.2.24)
        TAG_VERSION=${GITHUB_REF_NAME#v}
        echo "Tag version: $TAG_VERSION"
        
        # Get version from built package
        BUILT_VERSION=$(python -c "import re; whl=list(__import__('pathlib').Path('dist').glob('*.whl'))[0].name; print(re.search(r'-([0-9]+\.[0-9]+\.[0-9]+[^-]*)-', whl).group(1))")
        echo "Built version: $BUILT_VERSION"
        
        # Verify they match
        if [ "$BUILT_VERSION" != "$TAG_VERSION" ]; then
          echo "::error::Version mismatch! Tag is $TAG_VERSION but package built as $BUILT_VERSION"
          echo ""
          echo "This usually happens when there are commits after the tag."
          echo "Fix: Delete the tag, ensure you're on the correct commit, then recreate:"
          echo "  git tag -d $GITHUB_REF_NAME"
          echo "  git push origin :refs/tags/$GITHUB_REF_NAME"
          echo "  git tag $GITHUB_REF_NAME"
          echo "  git push origin $GITHUB_REF_NAME"
          exit 1
        fi
        echo "✅ Version validation passed: $BUILT_VERSION"

    - name: Validate tag points to HEAD
      run: |
        TAG_COMMIT=$(git rev-list -n 1 $GITHUB_REF_NAME)
        HEAD_COMMIT=$(git rev-parse HEAD)
        
        if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
          echo "::warning::Tag $GITHUB_REF_NAME points to $TAG_COMMIT but HEAD is $HEAD_COMMIT"
          echo "This may indicate the tag was created on a different commit."
        fi
        echo "Tag commit: $TAG_COMMIT"
        echo "HEAD commit: $HEAD_COMMIT"

    - name: Check package
      run: |
        twine check dist/*
        python -c "import json, os; from pathlib import Path; from scripts.release_check import validate_distributions; print(json.dumps(validate_distributions(Path('dist'), os.environ['GITHUB_REF_NAME'].removeprefix('v')), indent=2))"

    - name: Publish to PyPI
      shell: bash
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        # Any failed artifact upload fails the release, including an already
        # existing file. A partially published version is not a successful run.
        twine upload --non-interactive dist/*

    - name: Test installation from PyPI
      run: |
        # Wait for PyPI CDN to propagate the new version
        sleep 30

        # Extract version from tag (v0.2.20 -> 0.2.20)
        VERSION=${GITHUB_REF_NAME#v}
        echo "Installing gaik version: $VERSION"

        # Install exact version with retry logic for CDN propagation
        MAX_RETRIES=3
        RETRY_DELAY=30
        for i in $(seq 1 $MAX_RETRIES); do
          echo "Attempt $i of $MAX_RETRIES..."
          if pip install --no-cache-dir "gaik==$VERSION"; then
            echo "✅ Successfully installed gaik==$VERSION"
            break
          else
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Installation failed, waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
            else
              echo "❌ Failed to install after $MAX_RETRIES attempts"
              exit 1
            fi
          fi
        done

        # Verify correct version was installed
        INSTALLED=$(python -c "from gaik import __version__; print(__version__)")
        echo "Installed version: $INSTALLED"

    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-package
        path: dist/
        retention-days: 7

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        generate_release_notes: true
        files: dist/*
