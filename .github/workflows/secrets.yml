# Credentials in the commits a pull request or push adds, anywhere in the
# repository. The security job in solution-wizard-v2.yml scans the tree of a
# commit, and only when wizard paths change; this scans every commit of the
# change, so a key added in one commit and removed in the next is caught too,
# and it runs for every path (gaik-aiops/, the docs, the toolkit).
#
# Same gitleaks build and rules as the security job: .gitleaks.toml at the
# repository root. A finding fails the check; the report keeps the secret out
# of the log (--redact). A key that reached a pushed commit must be revoked
# even after it is removed: the commit stays in the history.
name: secrets

on:
  pull_request:
    branches: [develop, release/wizard-v2]
  push:
    branches: [develop, release/wizard-v2]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  # A cancelled push run would leave that push's commits unscanned.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep in step with the security job in solution-wizard-v2.yml.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Installed from the release tarball against a pinned checksum rather
      # than through an action, as in the security job.
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Secrets in the new commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          reports="$RUNNER_TEMP/reports"
          mkdir -p "$reports"
          common=(--no-banner --redact --exit-code 1 --config .gitleaks.toml --report-format json)
          status=0
          # The tree, always: git log shows no diff for a merge commit, so a
          # key added while resolving a conflict is only seen here.
          gitleaks dir . "${common[@]}" --report-path "$reports/gitleaks-tree.json" || status=1
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # First push of a branch, or a force push whose old head is gone.
            echo "No earlier commit to compare with; the tree scan covers it."
            exit "$status"
          fi
          echo "Scanning $range"
          gitleaks git . --log-opts="$range" "${common[@]}" \
            --report-path "$reports/gitleaks-commits.json" || status=1
          exit "$status"
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/reports/
          if-no-files-found: ignore
          retention-days: 7
