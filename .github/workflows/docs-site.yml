name: Docs site build

# Builds the docs site's static export on a pull request that touches it, with the
# same pnpm and Node versions as pages.yml, so a dependency update or a content
# change that breaks the build fails here instead of after the merge. It does not
# deploy: pages.yml publishes main.
on:
  pull_request:
    branches:
      - main
    paths:
      - "guidance_layer/website/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/docs-site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guidance_layer/website
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      # The client router prefetches each page's segment data from a flat file
      # name (`__next.<segment path>.txt`); a missing file means broken prefetch.
      - name: Check the exported prefetch files
        run: test -f 'out/__next.$oc$slug.__PAGE__.txt'
