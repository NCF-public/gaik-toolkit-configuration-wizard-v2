name: Dependency review

# Fails a pull request that adds a dependency with a known high or critical
# vulnerability. It reads the dependency graph, so it needs no checkout.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
    - name: Review the dependencies this pull request changes
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high
