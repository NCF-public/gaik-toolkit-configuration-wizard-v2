name: Solution Wizard V2

on:
  push:
    branches: [main, dev]
    paths:
      - "implementation_layer/solution_wizard_v2/**"
      - "implementation_layer/wizard_api/**"
      - ".github/workflows/solution-wizard-v2.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "implementation_layer/solution_wizard_v2/**"
      - "implementation_layer/wizard_api/**"
      - ".github/workflows/solution-wizard-v2.yml"
  workflow_dispatch:

jobs:
  wizard-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wizard
          POSTGRES_PASSWORD: wizard
          POSTGRES_DB: wizard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wizard -d wizard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install wizard_api
        working-directory: implementation_layer/wizard_api
        run: pip install -e ".[dev]"
      - name: Ruff (wizard_api)
        run: |
          pip install ruff==0.14.10
          ruff format --check implementation_layer/wizard_api/
          ruff check implementation_layer/wizard_api/
      - name: Pytest wizard_api
        working-directory: implementation_layer/wizard_api
        env:
          WIZARD_DATABASE_URL: postgresql+psycopg://wizard:wizard@localhost:5432/wizard
          WIZARD_SESSION_OUTPUT_ROOT: /tmp/wizard-sessions-ci
        run: pytest -v

  solution-wizard-v2:
    runs-on: ubuntu-latest
    needs: wizard-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: implementation_layer/solution_wizard_v2/package-lock.json
      - name: Install UI deps
        working-directory: implementation_layer/solution_wizard_v2
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python deps for BPMN scripts
        run: pip install "pydantic>=2.0"
      - name: Unit tests (vitest)
        working-directory: implementation_layer/solution_wizard_v2
        run: npm run test
      - name: ESLint
        working-directory: implementation_layer/solution_wizard_v2
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
        run: npm run lint
      - name: Build
        working-directory: implementation_layer/solution_wizard_v2
        env:
          NEXT_PUBLIC_DEV_AUTH: "true"
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-encryption-key-32-characters!!
        run: npm run build
      - name: Install Playwright browsers
        working-directory: implementation_layer/solution_wizard_v2
        run: npx playwright install chromium --with-deps
      - name: E2E tests
        working-directory: implementation_layer/solution_wizard_v2
        env:
          CI: "true"
          NEXT_PUBLIC_DEV_AUTH: "true"
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-encryption-key-32-characters!!
        run: npm run test:e2e
