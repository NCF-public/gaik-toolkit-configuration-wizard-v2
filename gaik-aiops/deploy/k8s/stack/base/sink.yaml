apiVersion: v1
kind: Service
metadata:
  name: sink
  labels: {app.kubernetes.io/name: sink}
spec:
  selector: {app.kubernetes.io/name: sink}
  ports: [{name: otlp-http, port: 4319, targetPort: 4319}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink
  labels: {app.kubernetes.io/name: sink}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: sink}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sink}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sink
          image: gaik-aiops/collection-sink
          ports: [{containerPort: 4319}]
          env:
            - name: WRITER_PASSWORD
              valueFrom: {secretKeyRef: {name: aiops-db, key: writer-password}}
            - {name: COLLECTION_DSN, value: "postgresql://collection_writer:$(WRITER_PASSWORD)@postgres:5432/observability"}
            - {name: AUDIT_RETENTION_DAYS, value: "365"}
            - {name: LOG_RETENTION_DAYS, value: "30"}
          readinessProbe:
            httpGet: {path: /healthz, port: 4319}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
