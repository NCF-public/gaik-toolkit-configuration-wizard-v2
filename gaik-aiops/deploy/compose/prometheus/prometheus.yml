# Metrics store for the collection layer. Receives OTLP from the collector,
# scrapes the collector's own telemetry, and sends alerts to Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # Keep the producing service as a label on every series.
  promote_resource_attributes:
    - service.name
    - deployment.environment.name

storage:
  tsdb:
    out_of_order_time_window: 10m

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
