# Alerts on the Solution Wizard API's own metrics (wizard_*), sent by the API
# over OTLP. Thresholds come from thresholds.yml. The metric names are a draft
# until the event schema v1.
groups:
  - name: gaik-wizard-service
    rules:
      - alert: WizardApiDown
        expr: absent_over_time(wizard_up[3m])
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The Wizard API has sent no metrics for 5 minutes

      # A new process start time within the window: the API restarted, for
      # example after running out of memory.
      - alert: WizardApiRestarted
        expr: changes(max by (service_name) (wizard_process_start_time)[15m:1m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }} restarted in the last 15 minutes"

      - alert: WizardApiMemoryHigh
        expr: |
          max by (service_name) (wizard_process_memory_used / wizard_process_memory_limit)
            > on () group_left () gaik:threshold:memory_used_ratio_warning
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: the api container uses {{ $value | humanizePercentage }} of its memory limit"

  - name: gaik-wizard-capacity
    rules:
      - alert: WizardAgentsNearLimit
        expr: |
          max by (service_name) (wizard_agents_live / wizard_agents_limit)
            > on () group_left () gaik:threshold:agents_used_ratio_warning
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: live agents at {{ $value | humanizePercentage }} of WIZARD_MAX_LIVE_AGENTS"

      - alert: WizardSandboxNearLimit
        expr: |
          max by (service_name) (wizard_sandbox_runs_active / wizard_sandbox_runs_limit)
            > on () group_left () gaik:threshold:sandbox_used_ratio_warning
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: sandbox runs at {{ $value | humanizePercentage }} of WIZARD_MAX_ACTIVE_RUNS"

      # Someone was turned away because a limit was full: agents, the chat
      # rate, or the sandbox.
      - alert: WizardCapacityRefusals
        expr: |
          sum by (service_name, code) (
            increase(wizard_refusals_total{code=~"agent_capacity|agent_busy|chat_rate_limited|sandbox_busy|busy"}[10m])
          ) > on () group_left () gaik:threshold:capacity_refusals_10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: {{ $value | printf `%.0f` }} requests refused with {{ $labels.code }} in 10 minutes"

      - alert: WizardTurnStuck
        expr: |
          max by (service_name) (wizard_turns_oldest_running)
            > on () group_left () gaik:threshold:stuck_turn_seconds
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: a chat turn has been running for {{ $value | humanizeDuration }}; its session is locked"

  - name: gaik-wizard-failures
    rules:
      - alert: WizardTurnFailures
        expr: |
          (
            sum by (service_name) (increase(wizard_turns_total{outcome="failed"}[15m]))
            /
            sum by (service_name) (increase(wizard_turns_total{outcome=~"failed|completed"}[15m]))
          ) > on () group_left () gaik:threshold:turn_failure_ratio_15m
          and sum by (service_name) (increase(wizard_turns_total[15m])) >= 5
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: {{ $value | humanizePercentage }} of chat turns failed in 15 minutes"

      # The model provider is refusing or failing: quota, overload or outage.
      - alert: WizardModelProviderErrors
        expr: |
          sum by (service_name, kind) (
            increase(wizard_agent_errors_total{kind=~"rate_limited|overloaded|server_error|timeout"}[10m])
          ) > on () group_left () gaik:threshold:provider_errors_10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: {{ $value | printf `%.0f` }} agent failures of kind {{ $labels.kind }} in 10 minutes"

      - alert: WizardSandboxFailures
        expr: |
          (
            sum by (service_name) (increase(wizard_sandbox_runs_total{phase!="succeeded"}[30m]))
            /
            sum by (service_name) (increase(wizard_sandbox_runs_total[30m]))
          ) > on () group_left () gaik:threshold:sandbox_failure_ratio_30m
          and sum by (service_name) (increase(wizard_sandbox_runs_total[30m])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: {{ $value | humanizePercentage }} of sandbox runs did not succeed in 30 minutes"

  - name: gaik-wizard-data
    rules:
      - alert: WizardSessionsVolumeFilling
        expr: |
          max by (service_name) (wizard_sessions_volume_used / wizard_sessions_volume_capacity)
            > on () group_left () gaik:threshold:volume_used_ratio_warning
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: the sessions volume is {{ $value | humanizePercentage }} full"

      - alert: WizardSessionsVolumeFull
        expr: |
          max by (service_name) (wizard_sessions_volume_used / wizard_sessions_volume_capacity)
            > on () group_left () gaik:threshold:volume_used_ratio_critical
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service_name }}: the sessions volume is {{ $value | humanizePercentage }} full; new sessions and runs will fail"

      - alert: WizardDatabaseLarge
        expr: |
          max by (service_name) (wizard_db_size)
            > on () group_left () gaik:threshold:database_bytes_warning
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: the wizard database is {{ $value | humanize1024 }}B"

  - name: gaik-wizard-sessions
    rules:
      # Sessions past the retention period are still there: the removal has
      # not run. The privacy notice promises the period.
      - alert: WizardSessionsOverdue
        expr: max by (service_name) (wizard_sessions{state="overdue"}) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: {{ $value }} sessions are past the retention period and not removed"

      - alert: WizardSessionDeleteFailed
        expr: sum by (service_name, reason) (increase(wizard_session_deletes_total{outcome="failed"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: a session deletion ({{ $labels.reason }}) failed; part of the session may remain"

      # Many requests for sessions that exist but belong to someone else.
      - alert: WizardOwnershipDenials
        expr: |
          sum by (service_name) (increase(wizard_ownership_denied_total[10m]))
            > on () group_left () gaik:threshold:ownership_denials_10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: {{ $value | printf `%.0f` }} requests for other users' sessions in 10 minutes"

      # One account creates sessions in a burst (shared event accounts, misuse, cost).
      # An owner's series appears with its first sessions already counted, so a
      # series that did not exist 10 minutes ago counts in full.
      - alert: WizardSessionBurst
        expr: |
          max by (service_name, owner) (
            (wizard_sessions_created_total - wizard_sessions_created_total offset 10m)
            or wizard_sessions_created_total
          ) > on () group_left () gaik:threshold:sessions_per_owner_10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: owner {{ $labels.owner }} created {{ $value | printf `%.0f` }} sessions in 10 minutes"

      - alert: WizardSessionCreateFailing
        expr: |
          sum by (service_name) (
            increase(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", span_name="POST /sessions", status_code="STATUS_CODE_ERROR"}[10m])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: creating a session failed in the last 10 minutes"

      - alert: WizardSessionLimitHits
        expr: sum by (service_name) (increase(wizard_refusals_total{code="input_too_large"}[30m])) > 0
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.service_name }}: uploads refused at the session or case size limit"

      - alert: WizardSessionDataMismatch
        expr: max by (service_name, kind) (wizard_sessions_mismatch) > 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.service_name }}: {{ $value }} session {{ $labels.kind }}"

  - name: gaik-wizard-reminders
    rules:
      # A reminder, not a fault: sandbox runs still read the project's shared
      # model key, which has no spending cap of its own. Set
      # WIZARD_POC_RUNNER_SECRET on the api to a Secret with a capped key.
      - alert: WizardRunsUseSharedModelKey
        expr: max by (service_name) (wizard_config_shared_runner_key) == 1
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.service_name }}: sandbox runs use the shared model key; give them a key with a spending cap"
