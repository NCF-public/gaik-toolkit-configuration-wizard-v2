# Generic service health derived from spans and logs. Metric-name agnostic
# producer metrics (tokens, cost and other LLM-specific measures) pass through
# unchanged and get their own rules from their schema owner.
groups:
  - name: gaik-service-health
    interval: 30s
    rules:
      - record: gaik:requests:rate5m
        expr: sum by (service_name, span_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m]))

      - record: gaik:request_errors:ratio5m
        expr: |
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
          /
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m]))

      - record: gaik:request_latency_ms:p50_5m
        expr: histogram_quantile(0.50, sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER"}[5m])))

      - record: gaik:request_latency_ms:p95_5m
        expr: histogram_quantile(0.95, sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER"}[5m])))

      - record: gaik:log_records:rate5m
        expr: sum by (service_name, gaik_event_class) (rate(gaik_log_records_total[5m]))

      - record: gaik:log_errors:rate5m
        expr: sum by (service_name) (rate(gaik_log_errors_total[5m]))
