# Overlay: secrets from OpenBao and a vault-held pseudonymisation key for the collector (WP4 S3).
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/openbao.yml up -d --build --wait
# Dev server: in-memory, auto-unsealed, root token for local setup only.
services:
  openbao:
    image: quay.io/openbao/openbao:2.2.0
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_ROOT_TOKEN:-root-local-only}
    cap_add: [IPC_LOCK]
    volumes:
      - bao-audit:/bao/audit
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      retries: 20

  openbao-init:
    image: quay.io/openbao/openbao:2.2.0
    user: "0"
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      BAO_TOKEN: ${OPENBAO_ROOT_TOKEN:-root-local-only}
    volumes:
      - ./openbao:/init:ro
      - approle-sink:/approle
      - agent-sink:/agent-out
      - agent-collector:/agent-collector
      - bao-audit:/bao/audit
      - otelcol-openbao:/otelcol-state
    depends_on:
      openbao:
        condition: service_healthy

  openbao-agent-sink:
    image: quay.io/openbao/openbao:2.2.0
    user: "10001"
    entrypoint: ["bao", "agent", "-config=/etc/bao/agent.hcl"]
    volumes:
      - ./openbao/agent-sink.hcl:/etc/bao/agent.hcl:ro
      - approle-sink:/approle:ro
      - agent-sink:/run/bao
    depends_on:
      openbao-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/bao/token && test -s /run/bao/collection_dsn"]
      interval: 2s
      retries: 30

  # The collector holds the vault key and pseudonymises before any destination; the sink stores what
  # it gets, so audit rows and MLflow traces share one pseudonym per user.
  openbao-agent-collector:
    image: quay.io/openbao/openbao:2.2.0
    user: "10001"
    entrypoint: ["bao", "agent", "-config=/etc/bao/agent.hcl"]
    volumes:
      - ./openbao/agent-collector.hcl:/etc/bao/agent.hcl:ro
      - approle-sink:/approle:ro
      - agent-collector:/run/bao
    depends_on:
      openbao-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/bao/pseudonym_key"]
      interval: 2s
      retries: 30

  sink:
    environment:
      COLLECTION_DSN: ""
      COLLECTION_DSN_FILE: /run/bao/collection_dsn
      PSEUDONYM_BACKEND: collector
    volumes:
      - agent-sink:/run/bao:ro
    depends_on:
      openbao-agent-sink:
        condition: service_healthy

  otel-collector:
    command: ["--config=/etc/otelcol/config.yaml", "--config=/etc/otelcol/generated/mlflow-routes.yaml", "--config=/etc/otelcol/openbao.yaml"]
    volumes:
      - ./openbao/otel-collector.openbao.yaml:/etc/otelcol/openbao.yaml:ro
      - bao-audit:/bao/audit:ro
      - otelcol-openbao:/var/lib/otelcol/openbao
      - agent-collector:/run/bao:ro
    depends_on:
      openbao-init:
        condition: service_completed_successfully
      openbao-agent-collector:
        condition: service_healthy

volumes:
  # AppRole credentials for both agents (sink and collector), one directory per role.
  approle-sink:
  agent-collector:
  agent-sink:
  bao-audit:
  otelcol-openbao:
