# Nightly backup of Keycloak's database: the realm, accounts, groups, second
# factors and sign-in events, so a broken volume or a wrong command does not
# lose every account.
#
# pg_dump (custom format) to memory, checked with pg_restore --list, encrypted
# for the public key in the Secret gaik-keycloak-backup-key (OpenPGP) and only
# then written to the volume; without a usable key the job stops before it
# dumps. Before each run, dumps 14 days old or older are deleted, except the 3
# newest.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: gaik-keycloak-backup
      labels:
        app: gaik-keycloak-backup
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 2Gi

  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: gaik-keycloak-backup
      labels:
        app: gaik-keycloak
    spec:
      schedule: "45 2 * * *"
      timeZone: Europe/Helsinki
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      jobTemplate:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 900
          ttlSecondsAfterFinished: 604800
          template:
            metadata:
              labels:
                app: gaik-keycloak-backup
            spec:
              restartPolicy: Never
              containers:
                - name: backup
                  # The database's own image, so pg_dump matches the server.
                  image: docker.io/pgvector/pgvector:pg17
                  imagePullPolicy: IfNotPresent
                  command:
                    - /bin/bash
                    - -c
                    - |
                      set -euo pipefail
                      shopt -s nullglob
                      # gpg keeps its state in memory; the recipient is read
                      # from the Secret's file, never from a keyring.
                      export GNUPGHOME=/work/gnupg
                      mkdir -m 700 "$GNUPGHOME"
                      key=/key/public-key.asc
                      gpg --batch --no-tty --with-colons --show-keys "$key" \
                        | awk -F: '$1=="pub" && $12 ~ /E/ {ok=1} END {exit !ok}' \
                        || { echo "no usable encryption key in $key"; exit 1; }
                      fpr="$(gpg --batch --no-tty --with-colons --show-keys "$key" | awk -F: '$1=="fpr"{print $10; exit}')"
                      # Prune first, so a full volume does not fail every
                      # night: a failed run's leftover, then dumps 14 days old
                      # or older, but never the 3 newest (names sort by date).
                      rm -f /backup/keycloak-*.part
                      dumps=(/backup/keycloak-*.dump.gpg)
                      keep=3
                      if (( ${#dumps[@]} > keep )); then
                        for old in "${dumps[@]:0:${#dumps[@]}-keep}"; do
                          find "$old" -mtime +13 -delete
                        done
                      fi
                      # The plain dump exists only in memory (/work).
                      plain=/work/keycloak.dump
                      f="/backup/keycloak-$(date +%Y%m%d-%H%M%S).dump.gpg"
                      pg_dump -h gaik-keycloak-db -d keycloak -Fc -f "$plain"
                      pg_restore --list "$plain" > /dev/null
                      gpg --batch --no-tty --quiet --trust-model always \
                        --recipient-file "$key" --encrypt -o "$f.part" "$plain"
                      rm -f "$plain"
                      gpg --batch --no-tty --list-only --decrypt "$f.part" > /dev/null 2>&1
                      mv "$f.part" "$f"
                      # Plain dumps from before encryption go once an
                      # encrypted one is kept.
                      rm -f /backup/keycloak-*.dump
                      echo "backup ok: $f (encrypted for key $fpr)"
                      ls -l /backup
                  env:
                    - name: PGUSER
                      valueFrom:
                        secretKeyRef: { name: gaik-keycloak-db, key: database-user }
                    - name: PGPASSWORD
                      valueFrom:
                        secretKeyRef: { name: gaik-keycloak-db, key: database-password }
                  volumeMounts:
                    - name: backup
                      mountPath: /backup
                    - name: work
                      mountPath: /work
                    - name: key
                      mountPath: /key
                      readOnly: true
                  resources:
                    # The memory limit covers the dump held in /work.
                    requests: { cpu: 100m, memory: 192Mi }
                    limits: { cpu: 500m, memory: 768Mi }
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
              volumes:
                - name: backup
                  persistentVolumeClaim:
                    claimName: gaik-keycloak-backup
                - name: work
                  emptyDir:
                    medium: Memory
                    sizeLimit: 384Mi
                - name: key
                  secret:
                    secretName: gaik-keycloak-backup-key
                    items:
                      - key: public-key.asc
                        path: public-key.asc
