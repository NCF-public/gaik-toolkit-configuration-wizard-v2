# Nightly backup of Keycloak's database: the realm, accounts, groups, second
# factors and sign-in events. Without it a broken volume or a wrong command
# would lose every account, and each user would have to set a password and a
# second factor again.
#
# pg_dump (custom format) to its own volume, checked with pg_restore --list
# before it counts; dumps older than 14 days are deleted. The dumps hold
# e-mail addresses and password hashes, so they stay in this project and are
# not copied to a laptop. Restoring: README.md, "Backups".
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: gaik-keycloak-backup
      labels:
        app: gaik-keycloak-backup
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 2Gi

  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: gaik-keycloak-backup
      labels:
        app: gaik-keycloak
    spec:
      schedule: "45 2 * * *"
      timeZone: Europe/Helsinki
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      jobTemplate:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 900
          ttlSecondsAfterFinished: 604800
          template:
            metadata:
              labels:
                app: gaik-keycloak-backup
            spec:
              restartPolicy: Never
              containers:
                - name: backup
                  # The database's own image, so pg_dump matches the server.
                  image: docker.io/pgvector/pgvector:pg17
                  imagePullPolicy: IfNotPresent
                  command:
                    - /bin/bash
                    - -c
                    - |
                      set -euo pipefail
                      f="/backup/keycloak-$(date +%Y%m%d-%H%M%S).dump"
                      pg_dump -h gaik-keycloak-db -d keycloak -Fc -f "$f.part"
                      pg_restore --list "$f.part" > /dev/null
                      mv "$f.part" "$f"
                      find /backup -name 'keycloak-*.dump.part' -delete
                      find /backup -name 'keycloak-*.dump' -mtime +14 -delete
                      echo "backup ok: $f"
                      ls -l /backup
                  env:
                    - name: PGUSER
                      valueFrom:
                        secretKeyRef: { name: gaik-keycloak-db, key: database-user }
                    - name: PGPASSWORD
                      valueFrom:
                        secretKeyRef: { name: gaik-keycloak-db, key: database-password }
                  volumeMounts:
                    - name: backup
                      mountPath: /backup
                  resources:
                    requests: { cpu: 100m, memory: 128Mi }
                    limits: { cpu: 500m, memory: 384Mi }
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
              volumes:
                - name: backup
                  persistentVolumeClaim:
                    claimName: gaik-keycloak-backup
