# Cluster-internal Services. Only the web Service is exposed publicly (route.yaml);
# the API stays ClusterIP and is reached by the frontend at http://wizard-v2-api:8100.
apiVersion: v1
kind: Service
metadata:
  name: wizard-v2-web
  labels:
    app: wizard-v2-web
spec:
  selector:
    app: wizard-v2-web
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: wizard-v2-api
  labels:
    app: wizard-v2-api
spec:
  selector:
    app: wizard-v2-api
  ports:
    - port: 8100
      targetPort: 8100
      protocol: TCP
