# Public HTTPS route to the frontend. `spec.host` is intentionally omitted so
# OpenShift auto-assigns wizard-v2-web-<project>.2.rahtiapp.fi — set an explicit
# host here only if a custom hostname is provisioned.
#
# The annotations matter for the streaming chat: response-buffering must be OFF
# or SSE tokens arrive in one lump at the end, and the timeout must be long
# enough for a full agent turn.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: wizard-v2-web
  labels:
    app: wizard-v2-web
  annotations:
    haproxy.router.openshift.io/timeout: 15m
    haproxy.router.openshift.io/response-buffering: "off"
    haproxy.router.openshift.io/disable-cookies: "true"
    haproxy.router.openshift.io/proxy-body-size: 50m
    # HSTS at the edge router (covers router error pages too). No preload on the
    # shared *.2.rahtiapp.fi domain. App-level HSTS is handled here instead.
    haproxy.router.openshift.io/hsts_header: "max-age=31536000;includeSubDomains"
spec:
  to:
    kind: Service
    name: wizard-v2-web
    weight: 100
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
