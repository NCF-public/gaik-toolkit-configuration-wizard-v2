[project]
name = "solution-wizard"
version = "0.1.0"
description = "GAIK Solution Wizard — BPMN generation and sync for wizard_api"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0,<3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["solution_wizard*"]
